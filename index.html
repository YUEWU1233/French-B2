function render(){const c=current();for(const id of ['card','flip','speak','star','exampleToggle'])$(id).hidden=!c;$('examplePanel').hidden=!c||!showExample;$('exampleToggle').setAttribute('aria-expanded',String(!!c&&showExample));$('exampleToggle').textContent=showExample?'隐藏例句':'显示例句';$('empty').hidden=!!c;for(const id of ['again','good','easy'])$(id).disabled=!c;$('counter').textContent=c?`本轮 ${index+1} / ${queue.length} · ${c.theme} · ${c.level}`:`完成 ${index} 张`;if(!c)return;
$('exampleFr').textContent=c.example;$('exampleZh').textContent=c.exampleZh;$('exampleZh').hidden=!back;
$('card').classList.toggle('back',back);$('meta').textContent=back?'VERSO · 中文释义':`RECTO · ${c.kind}`;$('word').textContent=back?c.zh:c.fr;$('word').lang=back?'zh-CN':'fr';$('hint').textContent=back?`${c.fr} · 书中词形：${c.sourceForm}`:'先在心中回忆意思，点击卡片翻面';$('flip').textContent=back?'返回法语 · 空格':'显示中文 · 空格';$('star').textContent=state.stars.includes(c.id)?'★ 已收藏':'☆ 收藏';const v=intervals(c);$('goodHint').textContent=v[1]+' 天后';$('easyHint').textContent=v[2]+' 天后'}
function flip(){if(current()){back=!back;render()}}
function rate(n){const c=current();if(!c)return;const days=intervals(c)[n];state.progress[c.id]={days,due:Date.now()+(n===0?600000:days*DAY),reviews:(state.progress[c.id]?.reviews||0)+1};save();index++;back=false;showExample=false;render();stats()}
function library(){const all=eligible();$('list').replaceChildren();for(const c of all.slice(0,shown)){let a=document.createElement('article'),f=document.createElement('div'),z=document.createElement('div'),s=document.createElement('small');f.textContent=c.fr;f.lang='fr';z.textContent=c.zh;s.textContent=`${c.theme} · ${c.kind} · ${c.level} · PDF ${c.page}`;z.append(s);const d=document.createElement('details'),sum=document.createElement('summary'),ef=document.createElement('p'),ez=document.createElement('p');sum.textContent='显示例句';ef.textContent=c.example;ef.lang='fr';ez.textContent=c.exampleZh;d.append(sum,ef,ez);z.append(d);a.append(f,z);$('list').append(a)}$('more').hidden=shown>=all.length;if(!all.length)$('list').textContent='没有符合筛选条件的词卡。'}
for(const t of [...new Set(cards.map(c=>c.theme))]){const o=document.createElement('option');o.textContent=t;$('theme').append(o)}
for(const id of ['theme','kind','mode','level'])$(id).onchange=reset;$('search').oninput=reset;
$('card').onclick=flip;$('flip').onclick=flip;$('again').onclick=()=>rate(0);$('good').onclick=()=>rate(1);$('easy').onclick=()=>rate(2);
$('star').onclick=()=>{const c=current();if(!c)return;state.stars=state.stars.includes(c.id)?state.stars.filter(x=>x!==c.id):[...state.stars,c.id];save();render()};
$('exampleToggle').onclick=()=>{showExample=!showExample;render()};
function speak(text){if(!text)return;if(!('speechSynthesis'in window)){$('notice').textContent='此浏览器不支持朗读。';return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang='fr-FR';u.rate=.85;const voice=speechSynthesis.getVoices().find(v=>v.lang.startsWith('fr'));if(voice)u.voice=voice;speechSynthesis.speak(u)}
$('speak').onclick=()=>speak(current()?.fr);$('exampleSpeak').onclick=()=>speak(current()?.example);
function switchTab(t){tab=t;$('study').hidden=t!=='study';$('library').hidden=t!=='library';$('studyTab').classList.toggle('active',t==='study');$('libraryTab').classList.toggle('active',t==='library');library()}
$('studyTab').onclick=()=>switchTab('study');$('libraryTab').onclick=()=>switchTab('library');$('more').onclick=()=>{shown+=60;library()};
document.onkeydown=e=>{if(['INPUT','SELECT','TEXTAREA','BUTTON','SUMMARY','A'].includes(e.target.tagName)||tab!=='study')return;if(e.code==='Space'){e.preventDefault();flip()}if(['1','2','3'].includes(e.key))rate(Number(e.key)-1)};
$('intro').textContent=`全书 211 页扫描 · ${cards.length} 张双语例句词卡 · 正面法语 / 背面中文 · 本地间隔复习`;
reset();if(!storageOK)$('notice').textContent='无法读取本地记录，请检查浏览器的网站存储设置。';

$('shareLink').onclick=async()=>{
 if(!/^https?:$/.test(location.protocol)){$('notice').textContent='请先部署到 GitHub Pages，再分享网站链接。';return}
 const url=location.href.split('#')[0];
 if(navigator.share){try{await navigator.share({title:document.title,text:'一起用词卡积累法语 B2 表达。',url});return}catch(e){if(e.name==='AbortError')return}}
 try{await navigator.clipboard.writeText(url);$('notice').textContent='网站链接已复制，可粘贴分享给朋友。'}catch(e){prompt('复制这个网站链接分享给朋友：',url)}
};

</script></html>
